[build-system]

# setuptools 77 is the first release to accept the SPDX string form of
# `project.license` used below (the older table form is deprecated and slated
# to become a build error); it also happens to be the first to require the
# same Python floor as protfasta itself.
requires = ["setuptools>=77", "versioningit~=2.0"]
build-backend = "setuptools.build_meta"


# define project info
[project]
name = "protfasta"
dynamic = ["version"]
description = "Lightweight package for reading and writing FASTA files."
authors = [
    {name = "Alex Holehouse", email = "alex.holehouse@wustl.edu"}
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Documentation = "https://protfasta.readthedocs.io/"
Source = "https://github.com/holehouse-lab/protfasta"
Issues = "https://github.com/holehouse-lab/protfasta/issues"


[project.optional-dependencies]
test = [
  "pytest>=6.1.2",
]

# define all the command-line scripts; example left, but you
# can delete this section if none.
[project.scripts]
pfasta = "protfasta.scripts.pfasta:main"

[tool.setuptools]
zip-safe = false
include-package-data = true 

[tool.setuptools.packages.find]
namespaces = true
where = ["."]
include = ["protfasta", "protfasta.*"]  # Discover all sub-packages inside the main package

[tool.setuptools.package-data]
protfasta = [
    "py.typed"
]

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
# The method key:
method = "git"  # <- The method name
# Parameters to pass to the method:
match = ["*"]
default-tag = "1.0.0"

[tool.versioningit.write]
file = "protfasta/_version.py"
