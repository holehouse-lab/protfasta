name: Run tox tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: Tox test on ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - toxenv: py39
            python-version: "3.9"
          - toxenv: py310
            python-version: "3.10"
          - toxenv: py311
            python-version: "3.11"
          - toxenv: py312
            python-version: "3.12"
          - toxenv: py313
            python-version: "3.13"
          - toxenv: py314
            python-version: "3.14"
          # 3.15 is still a pre-release, so it is allowed to fail without
          # blocking the build - a red run here usually means upstream churn
          # rather than a protfasta regression.
          - toxenv: py315
            python-version: "3.15"
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install tox
        run: pip install tox

      - name: Run tox
        run: tox -e ${{ matrix.toxenv }}