[tox]
envlist = py39, py310, py311, py312, py313, py314, py315

[testenv]
# Note we deliberately install the package under test from the local checkout
# (the tox default) rather than from GitHub, so that CI exercises the code in
# the branch being tested rather than whatever is currently on master.
#
# download = true makes virtualenv fetch a current pip rather than seeding the
# copy bundled with virtualenv. The bundled pip vendors a typing_extensions
# that still references typing.no_type_check_decorator, which was removed in
# Python 3.15, so seeding it breaks the py315 environment before any test runs.
download = true
deps =
    pytest
commands =
    pytest --pyargs protfasta.tests
